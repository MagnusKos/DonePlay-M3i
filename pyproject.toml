[project]
name = "rk260x-tools"
version = "0.1.0"
description = "Reverse-engineering & flashing toolset for RockChip RK2606A/RK26xx MP3/MP4 players (ZSP400 DSP)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyusb>=1.3",
    "pillow>=10",
]

[project.scripts]
rkx = "rk260x.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rk260x"]
